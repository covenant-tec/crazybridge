# Optimal Bellman decision policies pi*(s) for the 13-state Adaptive EKF
#
# Edit ONLY the two 3x3 tables below after re-training in `aekf_smdp_simulation.ipynb`.
# `crazybridge` loads this file automatically on connect and pushes the 18 action IDs
# to `ekfPolicy.*` on the Crazyflie in RAM — NO firmware recompilation needed.
#
# Action IDs (0..7):
#   0 = a0: Keep current Q and R
#   1 = a1: Inflate Q (+10%)
#   2 = a2: Deflate Q (-10%)
#   3 = a3: Replace Q (strict dynamic model)
#   4 = a4: Inflate R (+10%)
#   5 = a5: Deflate R (-10%)
#   6 = a6: Replace R (high-precision OptiTrack)
#   7 = a7: Restore nominal Q_base and R_base
#
# Matrix layout: rows = [N, M, A], columns = [DOWN, EQ, UP]
#   Row 0 (Nominal,  d_k <= 1.0):       N_DOWN  N_EQ  N_UP
#   Row 1 (Maniobra, 1.0 < d_k <= 3.0): M_DOWN  M_EQ  M_UP
#   Row 2 (Anomalia, d_k > 3.0):        A_DOWN  A_EQ  A_UP

# MDP 2D optimal policy matrix (3x3)
0  0  0
4  4  4
4  2  4

